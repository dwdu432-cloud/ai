<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم هندسة تقنيات الذكاء الاصطناعي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --main-color: #0088cc;
            --bg-color: #f4f6f9;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

            .header h2 {
                color: var(--main-color);
                margin-bottom: 5px;
                font-size: 20px;
            }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-top: 10px;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background-color: var(--main-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-pending {
            background: #ffeeba;
            color: #856404;
        }

        .badge-approved {
            background: #d4edda;
            color: #155724;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>قسم الذكاء الاصطناعي 🎓</h2>
        <p style="font-size: 12px; color: #666;">توثيق نشاطات وورش العمل للطلاب</p>
    </div>

    <!-- كارت رفع النشاط -->
    <div class="card">
        <h3 style="margin-top:0; color:#444; font-size: 16px;">إرسال نشاط جديد 📄</h3>
        <form id="uploadForm">
            <label>اختر الورشة أو النشاط:</label>
            <select id="activity_id" required>
                {% for act in activities %}
                <option value="{{ act.id }}">{{ act.title }}</option>
                {% endfor %}
            </select>

            <label>ارفق صورة الشهادة الموقعة:</label>
            <input type="file" id="file" accept="image/*,.pdf" required>

            <button type="submit">إرسال للتدقيق والاعتماد</button>
        </form>
    </div>

    <!-- كارت سجل النشاطات والدرجات -->
    <div class="card">
        <h3 style="margin-top:0; color:#444; font-size: 16px;">سجل نشاطاتي ودرجاتي 📊</h3>
        <div id="historyList">جاري تحميل السجل...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const studentId = tg.initDataUnsafe?.user?.id || "123456";

        // جلب سجل النشاطات الخاص بالمستخدم
        async function loadHistory() {
            const res = await fetch(`/api/my-submissions/${studentId}`);
            const data = await res.json();
            const listDiv = document.getElementById('historyList');

            if (data.length === 0) {
                listDiv.innerHTML = "<p style='font-size:12px; color:#888;'>لا يوجد نشاطات مسجلة بعد.</p>";
                return;
            }

            listDiv.innerHTML = data.map(item => `
                    <div class="history-item">
                        <div>
                            <strong style="font-size:13px;">${item.activity_title}</strong>
                            ${item.status === 'approved' ? `<br><small style="color:green;">+${item.points} درجات</small>` : ''}
                        </div>
                        <span class="badge ${item.status === 'approved' ? 'badge-approved' : 'badge-pending'}">
                            ${item.status === 'approved' ? 'مقبول' : 'قيد المراجعة'}
                        </span>
                    </div>
                `).join('');
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('student_id', studentId);
            formData.append('activity_id', document.getElementById('activity_id').value);
            formData.append('file', document.getElementById('file').files[0]);

            const res = await fetch('/api/submit', { method: 'POST', body: formData });
            const data = await res.json();
            alert(data.message);
            loadHistory();
        });

        loadHistory();
    </script>
</body>
</html>
